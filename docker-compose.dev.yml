version: '3.8'

services:
  maildev:
    image: maildev/maildev:2.2.1
    environment:
      MAILDEV_INCOMING_USER: mailuser
      MAILDEV_INCOMING_PASS: mailpassword
    ports:
      - "1080:1080"
      - "1025:1025"
  db:
    build:
      context: ./docker/postgres
    image: coop-postgis-pgvector:pg17
    container_name: coop_pg
    # Docker alloue 64 Mo de mémoire partagée par défaut, ce que PostgreSQL utilise pour ses
    # agrégats et jointures parallèles. Sur une base restaurée de production, les statistiques
    # d'un coordinateur (plus de 100 000 activités) dépassent ce plafond et échouent en `53100`
    # — « could not resize shared memory segment ». La prod, elle, tourne sur un Postgres managé
    # correctement dimensionné : le défaut ne se voyait qu'en local.
    shm_size: 1gb
    environment:
      - POSTGRES_DB=${NEXT_PUBLIC_APP_SLUG}
      - POSTGRES_USER=${NEXT_PUBLIC_APP_SLUG}
      - POSTGRES_PASSWORD=password

    ports:
      - '5433:5432'
    volumes:
      - coop-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - coop-network

volumes:
  coop-pgdata:
    name: coop_pgdata

networks:
  coop-network:
    external: false
    name: coop-network

