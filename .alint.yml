version: 1
rules:
  - id: zones-de-src
    kind: dir_absent
    level: error
    message: "src ne contient que app, features, libraries, configuration, cli, jobs, styles et generated (AGENTS.md)"
    paths:
      - "src/*"
      - "!src/{app,features,libraries,configuration,cli,jobs,styles,generated}"

  - id: fichiers-a-la-racine-de-src
    kind: file_absent
    level: error
    message: "À la racine de src, seules les conventions de Next : proxy.ts, instrumentation.ts, instrumentation-client.ts"
    paths:
      - "src/*"
      - "!src/{proxy,instrumentation,instrumentation-client}.ts"

  - id: dossiers-d-une-feature
    kind: dir_absent
    level: error
    message: "Dossier hors de la structure d'une feature (feature-architecture.md §1, §4, ST-3, ST-4, UI-7)"
    paths:
      - "src/features/**"
      - "!src/features/*"
      - "!src/features/*/{abilities,action,domain,fixtures,implementations,middlewares,ui}"
      - "!src/features/*/abilities/*"
      - "!src/features/*/abilities/*/{action,domain,implementations,ui}"
      - "!src/features/**/domain/*"
      - "!src/features/*/fixtures/*"
      - "!src/features/**/implementations/*"
      - "!src/features/**/implementations/*/*"
      - "!src/features/**/ui/{columns,components,filtres,forms,hooks,labels,layouts,pages,presenters,search-params,slots}"
      - "!src/features/**/ui/{components,forms,labels,presenters}/*"

  - id: racine-d-une-feature
    kind: for_each_dir
    level: error
    message: "À la racine d'une feature, seuls ses hooks Cucumber partagés, nommés d'après leur sujet, et la spécification d'une feature sans ability, nommée d'après elle (§1, TS-1)"
    select: "src/features/*"
    require:
      - kind: dir_only_contains
        select: "{path}"
        allow: ["*.cucumber.ts", "{basename}.feature.md", "{basename}.steps.ts"]

  - id: racine-d-une-ability
    kind: for_each_dir
    level: error
    message: "À la racine d'une ability, seules sa spécification et ses steps, nommées d'après elle (§4)"
    select: "src/features/*/abilities/*"
    require:
      - kind: dir_only_contains
        select: "{path}"
        allow: ["{basename}.ability.md", "{basename}.steps.ts"]

  - id: specification-de-l-ability
    kind: for_each_dir
    level: error
    message: "Toute ability a sa spécification exécutable au nom de son dossier (TS-1)"
    select: "src/features/*/abilities/*"
    require:
      - kind: file_exists
        paths: "{path}/{basename}.ability.md"
      - kind: file_exists
        paths: "{path}/{basename}.steps.ts"

  - id: contrats-d-action
    kind: dir_only_contains
    level: error
    message: "action/ ne contient que des .key, .validation, .errors, .transfer et leurs tests (ST-5, ST-6)"
    select: "src/features/**/action"
    allow:
      - "*.{key,validation,errors,transfer}.ts"
      - "*.{validation,errors,transfer}.spec.ts"

  - id: domaine
    kind: dir_only_contains
    level: error
    message: "domain/ ne contient que du TypeScript sans JSX (§2)"
    select: "{src/features/**/domain,src/features/**/domain/*}"
    allow: ["*.ts"]

  - id: middlewares
    kind: dir_only_contains
    level: error
    message: "middlewares/ ne contient que des with-<nom>.ts (§1)"
    select: "src/features/*/middlewares"
    allow: ["with-*.ts", "with-*.spec.ts"]

  - id: fixtures
    kind: dir_only_contains
    level: error
    message: "fixtures/ ne contient que des données de test en TypeScript ou en Excel"
    select: "{src/features/*/fixtures,src/features/*/fixtures/*}"
    allow: ["*.ts", "*.xlsx"]

  - id: dossiers-sans-fichier
    kind: file_absent
    level: error
    message: "Ce dossier ne contient que des dossiers"
    paths:
      - "src/features/*"
      - "src/features/*/abilities/*"
      - "src/features/**/implementations/*"
      - "src/features/**/ui/*"
      - "src/app/_actions/*"
      - "src/libraries/*"
      - "src/configuration/*"

  - id: nom-d-un-fichier-du-domaine
    kind: filename_regex
    level: error
    message: "Un fichier du domaine n'a pas de catégorie : <nom>.ts, son test <nom>.spec.ts (ST-5)"
    paths: ["src/features/**/domain/**"]
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*(\.spec)?\.ts$'

  - id: nom-d-une-implementation
    kind: filename_regex
    level: error
    message: "Une implémentation porte une seule catégorie, celle de son rôle (ST-5)"
    paths: ["src/features/**/implementations/**"]
    pattern: '^([a-z0-9]+(-[a-z0-9]+)*\.(query|mutation|transfer|client|sql|where|select|order-by|payload|params|response|middleware|classeur|adapter)(\.(spec|integration))?\.ts|[a-z0-9]+(-[a-z0-9]+)*\.(email|email-fragment)(\.spec)?\.tsx|[a-z0-9]+(-[a-z0-9]+)*\.d\.ts|[a-z0-9]+(-[a-z0-9]+)*\.(openapi|openapi-config)\.json|index\.ts)$'

  - id: implementations-par-categorie
    kind: dir_only_contains
    level: error
    message: "Une implémentation porte la catégorie de son rôle (ST-5)"
    select: "{src/features/**/implementations/*,src/features/**/implementations/*/*}"
    allow:
      - "index.ts"
      - "*.d.ts"
      - "*.{query,mutation,transfer,client,sql,where,select,order-by,payload,params,response,middleware,classeur,adapter}.ts"
      - "*.{query,mutation,transfer,client,sql,where,select,order-by,payload,params,response,middleware,classeur,adapter}.{spec,integration}.ts"
      - "*.email.tsx"
      - "*.email.spec.tsx"
      - "*.email-fragment.tsx"
      - "*.openapi.json"
      - "*.openapi-config.json"

  - id: presenters
    kind: dir_only_contains
    level: error
    message: "presenters/ ne contient que des .presenter.ts (UI-7)"
    select: "{src/features/**/ui/presenters,src/features/**/ui/presenters/*}"
    allow: ["*.presenter.ts", "*.presenter.spec.ts"]

  - id: libelles
    kind: dir_only_contains
    level: error
    message: "labels/ ne contient que des .labels.ts(x) (UI-7)"
    select: "{src/features/**/ui/labels,src/features/**/ui/labels/*}"
    allow: ["*.labels.ts", "*.labels.tsx", "*.labels.spec.ts"]

  - id: etat-d-url
    kind: dir_only_contains
    level: error
    message: "search-params/ ne contient que des .search-params.ts (UI-7)"
    select: "src/features/**/ui/search-params"
    allow: ["*.search-params.ts", "*.search-params.spec.ts"]

  - id: colonnes
    kind: dir_only_contains
    level: error
    message: "columns/ ne contient que des .columns.ts(x) (UI-7)"
    select: "src/features/**/ui/columns"
    allow: ["*.columns.ts", "*.columns.tsx", "*.columns.spec.ts"]

  - id: filtres
    kind: dir_only_contains
    level: error
    message: "filtres/ ne contient que des .filtre.ts (UI-7)"
    select: "src/features/**/ui/filtres"
    allow: ["*.filtre.ts", "*.filtre.spec.ts"]

  - id: hooks
    kind: dir_only_contains
    level: error
    message: "hooks/ ne contient que des use-<nom>.ts (UI-7)"
    select: "src/features/**/ui/hooks"
    allow: ["use-*.ts", "use-*.spec.ts"]

  - id: slots
    kind: dir_only_contains
    level: error
    message: "slots/ ne contient que des <Nom>.slot.tsx (UI-7)"
    select: "src/features/**/ui/slots"
    allow: ["*.slot.tsx", "*.slot.{stories,cy}.tsx"]

  - id: pages
    kind: dir_only_contains
    level: error
    message: "pages/ ne contient que des <Nom>Page.tsx (UI-7)"
    select: "src/features/**/ui/pages"
    allow: ["*Page.tsx", "*Page.{stories,cy}.tsx"]

  - id: layouts
    kind: dir_only_contains
    level: error
    message: "layouts/ ne contient que des <Nom>Layout.tsx (UI-7)"
    select: "src/features/**/ui/layouts"
    allow: ["*Layout.tsx", "*Layout.{stories,cy}.tsx"]

  - id: composants
    kind: dir_only_contains
    level: error
    message: "components/ ne contient que des composants <Nom>.tsx (UI-7)"
    select: "{src/features/**/ui/components,src/features/**/ui/components/*}"
    allow: ["[A-Z]*.tsx", "[A-Z]*.{stories,cy}.tsx"]

  - id: formulaires
    kind: dir_only_contains
    level: error
    message: "forms/ ne contient que des formulaires, leurs champs et leurs .validation, .form-options, .form-data (UI-7)"
    select: "{src/features/**/ui/forms,src/features/**/ui/forms/*}"
    allow:
      - "*Form.tsx"
      - "*Fields.tsx"
      - "*Field.tsx"
      - "*ComboBox.tsx"
      - "*{Form,Fields,Field,ComboBox}.{stories,cy}.tsx"
      - "*.{validation,form-options,form-data}.ts"
      - "*.{validation,form-options,form-data}.spec.ts"

  - id: categorie-dans-son-dossier
    kind: file_absent
    level: error
    message: "Une catégorie ne vit que dans le dossier de son rôle (ST-5, UI-7)"
    paths:
      - "src/**/*.{presenter,labels,search-params,columns,filtre,slot,key,form-data,form-options,action,job,execution}.{ts,tsx}"
      - "!src/features/**/ui/presenters/**/*.presenter.ts"
      - "!src/features/**/ui/labels/**/*.labels.{ts,tsx}"
      - "!src/features/**/ui/search-params/*.search-params.ts"
      - "!src/features/**/ui/columns/*.columns.{ts,tsx}"
      - "!src/features/**/ui/filtres/*.filtre.ts"
      - "!src/features/**/ui/slots/*.slot.tsx"
      - "!src/features/**/action/*.key.ts"
      - "!src/features/**/ui/forms/**/*.{form-data,form-options}.ts"
      - "!src/app/_actions/*/*.action.ts"
      - "!src/jobs/*/*.{job,execution}.ts"

  - id: un-test-a-cote-de-sa-source-ts
    kind: file_graph
    level: error
    message: "Un test porte le nom du fichier qu'il exerce et vit à côté de lui (D1)"
    nodes: "src/**/*.{spec,integration}.ts"
    edges:
      derive_target:
        from: '^(.+)\.(spec|integration)\.ts$'
        to: "$1.ts"
    require: no_dangling

  - id: un-test-a-cote-de-sa-source-tsx
    kind: file_graph
    level: error
    message: "Un test porte le nom du fichier qu'il exerce et vit à côté de lui (D1)"
    nodes: "src/**/*.{spec,stories,cy}.tsx"
    edges:
      derive_target:
        from: '^(.+)\.(spec|stories|cy)\.tsx$'
        to: "$1.tsx"
    require: no_dangling

  - id: un-test-de-page-a-cote-de-sa-page
    kind: file_graph
    level: error
    message: "Un test de page vit à côté d'elle (ST-7)"
    nodes: "src/app/**/page.test.ts"
    edges:
      derive_target:
        from: '^(.+)/page\.test\.ts$'
        to: "$1/page.tsx"
    require: no_dangling

  - id: un-test-de-route-a-cote-de-sa-route
    kind: file_graph
    level: error
    message: "Un test de route vit à côté d'elle (ST-7)"
    nodes: "src/app/**/route.test.ts"
    edges:
      derive_target:
        from: '^(.+)/route\.test\.ts$'
        to: "$1/route.ts"
    require: no_dangling

  - id: transfert-teste
    kind: file_graph
    level: error
    message: "Un .transfer.ts a son test aller-retour (.transfer.spec.ts)"
    nodes: "src/**/*.transfer.ts"
    edges:
      derive_target:
        from: '^(.+)\.transfer\.ts$'
        to: "$1.transfer.spec.ts"
    require: no_dangling

  - id: au-plus-32-fichiers
    kind: max_files_per_directory
    level: error
    message: "Au-delà de 32 fichiers à plat, regrouper par sujet ou scinder la feature (ST-3)"
    paths:
      - "src/**"
      - "!src/generated/**"
      - "!src/**/*.{spec,integration}.ts"
      - "!src/**/*.{spec,stories,cy}.tsx"
    max_files: 32

  - id: nommage
    kind: filename_regex
    level: error
    message: "Fichier en kebab-case, sauf un .tsx dont l'export principal est un composant, en PascalCase (ST-1)"
    paths:
      - "src/**"
      - "e2e/**"
      - "!src/generated/**"
      - "!src/app/**/{favicon.ico,icon.svg,apple-icon.png}"
      - "!e2e/screenshots/**"
    pattern: '^([a-z0-9]+(-[a-z0-9]+)*(\.[a-z0-9]+(-[a-z0-9]+)*)*\.[a-z]+|[A-Z][A-Za-z0-9]*(\.[a-z0-9]+(-[a-z0-9]+)*)*\.tsx)$'

  - id: fichiers-d-une-route
    kind: dir_only_contains
    level: error
    message: "Une route de app ne contient que les fichiers de Next et ses tests (§ app, ST-7)"
    select: "{src/app,src/app/[!_]*,src/app/[!_]*/**}"
    allow:
      - "{page,layout,template,loading,error,not-found,global-error,default}.tsx"
      - "{route,manifest,robots,sitemap}.ts"
      - "{page,route}.test.ts"
      - "{favicon.ico,icon.svg,apple-icon.png}"
      - "security.txt"

  - id: actions-par-feature
    kind: for_each_dir
    level: error
    message: "app/_actions/<feature>/ porte le nom d'une feature existante"
    select: "src/app/_actions/*"
    require:
      - kind: dir_exists
        paths: "src/features/{basename}"

  - id: actions
    kind: dir_only_contains
    level: error
    message: "app/_actions/<feature>/ ne contient que des <ability>.action.ts"
    select: "src/app/_actions/*"
    allow: ["*.action.ts"]

  - id: libraries
    kind: dir_only_contains
    level: error
    message: "Une library ne contient que du TypeScript, et du JSON de données"
    select: "src/libraries/**"
    allow: ["*.ts", "*.tsx", "*.json"]

  - id: profondeur-des-libraries
    kind: dir_absent
    level: error
    message: "Une library a au plus deux niveaux de sous-dossiers par sujet"
    paths: ["src/libraries/*/*/*/*"]

  - id: configuration
    kind: dir_only_contains
    level: error
    message: "configuration/ ne contient que du TypeScript"
    select: "src/configuration/**"
    allow: ["*.ts", "*.tsx"]

  - id: cli
    kind: dir_only_contains
    level: error
    message: "cli/ ne contient que du TypeScript"
    select: "{src/cli,src/cli/**}"
    allow: ["*.ts"]

  - id: une-tache
    kind: for_each_dir
    level: error
    message: "Une tâche range <tâche>.job.ts et <tâche>.execution.ts (CONTRIBUTING)"
    select: "src/jobs/*"
    require:
      - kind: file_exists
        paths: "{path}/{basename}.job.ts"
      - kind: file_exists
        paths: "{path}/{basename}.execution.ts"

  - id: dossier-d-une-tache
    kind: dir_only_contains
    level: error
    message: "Une tâche ne contient que <tâche>.job.ts et <tâche>.execution.ts (CONTRIBUTING)"
    select: "src/jobs/*"
    allow: ["*.job.ts", "*.execution.ts"]

  - id: styles
    kind: dir_only_contains
    level: error
    message: "styles/ ne contient que du CSS"
    select: "{src/styles,src/styles/**}"
    allow: ["*.css"]

  - id: dossiers-d-e2e
    kind: dir_absent
    level: error
    message: "e2e/ ne contient que support, tasks, fixtures, proconnect-simule et screenshots"
    paths:
      - "e2e/**"
      - "!e2e/{support,tasks,tasks/handlers,fixtures,proconnect-simule,screenshots}"

  - id: dossiers-en-kebab-case
    kind: dir_absent
    level: error
    message: "Dossier en kebab-case : minuscules sans accent, chiffres, tirets simples entre deux mots (ST-1)"
    paths:
      - "src/**/*[^a-z0-9/-]*"
      - "e2e/**/*[^a-z0-9/-]*"
      - "src/**/-*"
      - "src/**/*-"
      - "src/**/*--*"
      - "e2e/**/-*"
      - "e2e/**/*-"
      - "e2e/**/*--*"
      - "!src/app/**"
      - "!src/generated/**"

  - id: segments-de-route
    kind: dir_absent
    level: error
    message: "Un segment de route est en kebab-case, ou une convention de Next : (groupe), [paramètre], _actions, .well-known"
    paths:
      - "src/app/**/*[A-Z]*"
      - "src/app/**/_*"
      - "src/app/**/*[^a-z0-9/()._@-]*"
      - "!src/app/**/[[]*]"
      - "!src/app/_actions"

  - id: categorie-hors-de-son-dossier
    kind: file_absent
    level: error
    message: "Une catégorie ne vit que dans le dossier de son rôle (ST-5, TS-1, ST-7)"
    paths:
      - "src/**/*.{validation,errors}.ts"
      - "src/**/*.transfer.ts"
      - "src/**/*.{query,mutation,sql,where,select,order-by,payload,params,response,client,middleware,classeur,adapter}.ts"
      - "src/**/*.{email,email-fragment}.tsx"
      - "src/**/*.{ability,feature}.md"
      - "src/**/*.{steps,cucumber}.ts"
      - "src/**/*.e2e.ts"
      - "e2e/*/**/*.e2e.ts"
      - "src/**/*.openapi*.json"
      - "!src/features/**/action/*.{validation,errors,transfer}.ts"
      - "!src/features/**/ui/forms/**/*.validation.ts"
      - "!src/features/**/implementations/*/**/*.{transfer,query,mutation,sql,where,select,order-by,payload,params,response,client,middleware,classeur,adapter}.ts"
      - "!src/features/**/implementations/email/*.{email,email-fragment}.tsx"
      - "!src/features/*/abilities/*/*.{ability.md,steps.ts}"
      - "!src/features/*/*.{cucumber.ts,steps.ts,feature.md}"
      - "!src/features/**/implementations/openapi/*.openapi*.json"

  - id: barrels-d-une-feature
    kind: file_absent
    level: error
    message: "Dans une feature, un barrel n'est admis que dans domain/index.ts et implementations/<technique>/index.ts : ailleurs, on importe le fichier qui définit le symbole (ST-2)"
    paths:
      - "src/features/**/index.{ts,tsx}"
      - "!src/features/**/domain/index.ts"
      - "!src/features/**/implementations/*/index.ts"

  - id: tests-executes
    kind: file_absent
    level: error
    message: "Un test se nomme .spec, .integration, .stories ou .cy (.tsx), ou page.test et route.test dans app : sinon personne ne l'exécute (D1, ST-7)"
    paths:
      - "src/**/*.test.{ts,tsx}"
      - "src/**/*.{stories,cy}.ts"
      - "src/**/*.integration.tsx"
      - "!src/app/**/{page,route}.test.ts"

  - id: declarations-de-types
    kind: file_absent
    level: error
    message: "Un .d.ts augmente un module extérieur à côté du code qui en dépend : dans une technique d'implementations/ ou dans configuration/ (ST-5)"
    paths:
      - "src/**/*.d.ts"
      - "!src/features/**/implementations/*/*.d.ts"
      - "!src/configuration/**/*.d.ts"

  - id: racine-de-library-en-typescript-pur
    kind: file_absent
    level: error
    message: "La racine d'une library est du TypeScript pur, chargeable partout : un composant vit dans un sujet (ST-2)"
    paths: ["src/libraries/*/*.tsx"]

  - id: pas-de-sous-dossier
    kind: dir_absent
    level: error
    message: "Une tâche et les actions d'une feature tiennent dans un seul dossier"
    paths:
      - "src/jobs/*/*"
      - "src/app/_actions/*/*"

  - id: racine-des-jobs
    kind: dir_only_contains
    level: error
    message: "La racine de jobs/ ne contient que le point d'entrée et ses modules TypeScript"
    select: "src/jobs"
    allow: ["*.ts"]

  - id: racine-d-e2e
    kind: dir_only_contains
    level: error
    message: "La racine d'e2e/ ne contient que les parcours et la configuration de l'outillage"
    select: "e2e"
    allow:
      ["*.e2e.ts", "tsconfig.json", "biome.json", "cypress.env", "timings.json"]

  - id: pas-de-fichier-blanc
    kind: file_content_matches
    level: error
    message: "Un fichier qui ne contient que des blancs n'a rien à faire dans le dépôt"
    paths:
      - "src/**/*.{ts,tsx,md,css,json}"
      - "e2e/**/*.{ts,tsx,md,json}"
      - "!src/generated/**"
    pattern: '\S'

  - id: pas-de-fichier-vide
    kind: no_empty_files
    level: error
    message: "Un fichier vide n'a rien à faire dans le dépôt"
    paths: ["src/**", "e2e/**", "!src/generated/**"]

  - id: pas-de-collision-de-casse
    kind: no_case_conflicts
    level: error
    message: "Deux chemins ne diffèrent pas que par la casse (macOS et Windows ne les distinguent pas)"
    paths: ["src/**", "e2e/**"]

  - id: entree-d-une-library
    kind: for_each_file
    level: error
    message: "Une library qui porte des fichiers à sa racine a un index.ts, son entrée en TypeScript pur"
    select: "src/libraries/*/*.{ts,tsx}"
    require:
      - kind: file_exists
        paths: "{dir}/index.ts"

  - id: entree-d-un-sujet-de-library
    kind: for_each_dir
    level: error
    message: "Chaque sujet d'une library a son entrée, un index"
    select: "src/libraries/*/*"
    require:
      - kind: file_exists
        paths: "{path}/index.{ts,tsx}"

  - id: entree-d-un-module-de-configuration
    kind: for_each_dir
    level: error
    message: "Chaque module de configuration a son entrée, un index"
    select: "src/configuration/*"
    require:
      - kind: file_exists
        paths: "{path}/index.{ts,tsx}"

  - id: hook-client
    kind: file_starts_with
    level: error
    message: "Un hook est du code client : il commence par 'use client'"
    paths:
      - "src/**/use-*.{ts,tsx}"
      - "src/**/hooks/*.{ts,tsx}"
      - "!src/**/*.{spec,stories,cy}.{ts,tsx}"
      - "!src/**/index.ts"
    prefix: "'use client'"

  - id: specification-en-francais
    kind: file_content_forbidden
    level: error
    message: "Une spécification s'écrit avec les mots-clés Gherkin français : un mot-clé anglais n'est plus reconnu"
    paths:
      - "src/features/*/*.feature.md"
      - "src/features/*/abilities/*/*.ability.md"
    pattern: '(?m)^(#+ +(Feature|Rule|Background|Scenario|Scenario Outline|Scenario Template|Example|Examples|Scenarios) *:|\* +(Given|When|Then|And|But) )'

  - id: entree-sans-code
    kind: file_content_forbidden
    level: error
    message: "Une entrée ne contient que des réexports : ni code, ni directive (ST-2)"
    paths:
      - "src/libraries/*/index.{ts,tsx}"
      - "src/libraries/*/*/index.{ts,tsx}"
      - "src/configuration/*/index.{ts,tsx}"
      - "src/configuration/*/serveur.{ts,tsx}"
      - "src/features/**/domain/index.ts"
      - "src/features/**/implementations/*/index.ts"
    pattern: '(?m)^(''use (client|server)''|"use (client|server)"|import |const |let |var |function |async |class |enum |interface |type |declare |export (const|let|var|function|async|class|enum|interface|default|declare)\b|export type [A-Za-z_$][\w$]*\s*[<=])'

  - id: ports-d-un-orchestrateur
    kind: for_each_dir
    level: error
    message: "Un orchestrateur d'ability, domain/<ability>.ts, a ses ports à côté de lui, dans domain/ports.ts (AB-8)"
    select: "src/features/*/abilities/*"
    require:
      - kind: for_each_file
        select: "{path}/domain/{basename}.ts"
        require:
          - kind: file_exists
            paths: "{path}/domain/ports.ts"

  - id: pas-de-fixtures-dans-le-domaine
    kind: file_absent
    level: error
    message: "Pas de fixtures de test dans le domaine : un test unitaire écrit ses valeurs (AB-9, TS-8)"
    paths:
      - "src/features/**/domain/fixtures.ts"
      - "src/features/**/domain/**/fixtures.ts"
