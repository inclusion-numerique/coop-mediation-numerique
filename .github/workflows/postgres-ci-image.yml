---
name: Postgres CI image

on:
  push:
    branches:
      - main
    paths:
      - "docker/postgres-ci/**"
      - ".github/workflows/postgres-ci-image.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Postgres CI image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag ghcr.io/inclusion-numerique/coop-postgres-ci:pg17-vector-postgis \
            --tag "ghcr.io/inclusion-numerique/coop-postgres-ci:sha-${{ github.sha }}" \
            docker/postgres-ci
      - name: Push image
        run: docker push --all-tags ghcr.io/inclusion-numerique/coop-postgres-ci
