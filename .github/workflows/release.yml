---
name: Release

on:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  build-dev:
    name: Build dev
    uses: ./.github/workflows/build.reusable.yml
    with:
      environnement: dev
    secrets: inherit

  build-production:
    name: Build production
    uses: ./.github/workflows/build.reusable.yml
    with:
      environnement: main
    secrets: inherit

  plan-dev:
    name: Plan dev
    uses: ./.github/workflows/infrastructure-plan.reusable.yml
    with:
      environnement: dev
    secrets: inherit

  plan-production:
    name: Plan production
    uses: ./.github/workflows/infrastructure-plan.reusable.yml
    with:
      environnement: main
    secrets: inherit

  approve-dev:
    name: Approve dev infrastructure
    needs: plan-dev
    if: needs.plan-dev.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: infrastructure-approval
    steps:
      - name: Infrastructure plan approved
        run: echo "Plan de l'infrastructure dev approuvé"

  approve-production:
    name: Approve production infrastructure
    needs: plan-production
    if: needs.plan-production.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: infrastructure-approval
    steps:
      - name: Infrastructure plan approved
        run: echo "Plan de l'infrastructure de production approuvé"

  deploy-dev:
    name: Deploy dev
    needs: [build-dev, plan-dev, approve-dev]
    if: >-
      !cancelled()
      && needs.build-dev.result == 'success'
      && needs.plan-dev.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.approve-dev.result)
    uses: ./.github/workflows/deploy.reusable.yml
    with:
      environnement: dev
      environnement-github: ${{ needs.build-dev.outputs.environnement }}
      image: ${{ needs.build-dev.outputs.image }}
    permissions:
      contents: read
      deployments: write
    secrets: inherit

  deploy-production:
    name: Deploy production
    needs: [build-production, plan-production, approve-production, deploy-dev]
    if: >-
      !cancelled()
      && needs.build-production.result == 'success'
      && needs.plan-production.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.approve-production.result)
      && needs.deploy-dev.result == 'success'
    uses: ./.github/workflows/deploy.reusable.yml
    with:
      environnement: main
      environnement-github: ${{ needs.build-production.outputs.environnement }}
      image: ${{ needs.build-production.outputs.image }}
    permissions:
      contents: read
      deployments: write
    secrets: inherit

  prune-registry:
    name: Prune registry
    needs: deploy-production
    if: ${{ !cancelled() && needs.deploy-production.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Delete orphan images and old main and dev tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --silent cli infrastructure:prune-registry --apply

  build-documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes graphviz
      - name: Create env file
        run: cp .env.example .env
      - name: Unit test coverage
        run: pnpm --silent exec vitest run --project unit --coverage
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Collect documentation
        run: pnpm --silent docs:collect
      - name: Build documentation
        env:
          ORIGINE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: pnpm exec astro build --root docs/site --config ../astro.config.mjs --site "$ORIGINE" --base "$BASE/"
      - name: Add reports
        run: cp -r docs/site/annexes docs/site/dist/annexes
      - name: Upload documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy-documentation:
    name: Deploy documentation
    needs: build-documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
