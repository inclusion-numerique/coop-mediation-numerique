---
name: Validate

on:
  push:
    branches:
      - 'chore/*'
      - 'docs/*'
      - 'feat/*'
      - 'fix/*'
      - 'refactor/*'
      - 'test/*'
      - 'dev'
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Monorepo manypkg check
        run: pnpm manypkg check
      - name: Tsc
        run: pnpm tsc
      - name: Lint all packages except @app/web
        run: pnpm -F '!@app/web' lint
      - name: Lint @app/web - biome
        run: pnpm -F '@app/web' lint:biome
      - name: Generate openapi docs for api v1
        run: pnpm --silent -F @app/web api-v1-doc:generate
      - name: Check that openapi spec file is up to date
        run: |
          git diff --exit-code apps/web/src/app/api/v1/documentation/v1.openapi.json || {
            echo "::error::Openapi spec file has changed, please run 'pnpm --silent -F @app/web api-v1-doc:generate' to update the openapi spec file and commit the changes"
            exit 1
          }
      - name: Lint @app/web - api
        run: pnpm -F '@app/web' lint:api

  test-packages:
    name: Test packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create env file
        run: cp .env.dist .env
      - name: Test all packages except @app/web with coverage
        run: pnpm -F '!coop-mediation-numerique' -F '!@app/web' -F '!@app/e2e' -F '!@app/storybook' exec jest --coverage --passWithNoTests
      - name: List coverage reports
        id: coverage
        run: |
          shopt -s nullglob
          files=(apps/*/coverage/lcov.info packages/*/coverage/lcov.info)
          echo "files=${files[*]}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: ${{ steps.coverage.outputs.files }}
          flag-name: packages
          parallel: true
          fail-on-error: false

  test-web:
    name: Test web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create env file
        run: cp .env.dist .env
      - name: Test @app/web with coverage
        run: pnpm --silent -F @app/web exec jest --coverage -c jest.unit.config.ts
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: apps/web/coverage/lcov.info
          flag-name: web-unit
          parallel: true
          fail-on-error: false

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: rg.fr-par.scw.cloud/coop-mediation-numerique-ci/circleci-postgres:pg17-vector-postgis
        credentials:
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
        env:
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      maildev:
        image: maildev/maildev:2.2.1
        env:
          MAILDEV_INCOMING_USER: mailuser
          MAILDEV_INCOMING_PASS: mailpassword
        ports:
          - 1025:1025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test environment
        uses: ./.github/actions/test-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Load fixtures
        run: pnpm -F @app/fixtures load
      - name: Run web integration tests with coverage
        run: |
          set -a
          source .env
          set +a
          pnpm --silent -F @app/web exec jest --coverage -c jest.integration.config.ts --runInBand
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: apps/web/coverage/lcov.info
          flag-name: web-integration
          parallel: true
          fail-on-error: false

  cucumber:
    name: Cucumber
    runs-on: ubuntu-latest
    services:
      postgres:
        image: rg.fr-par.scw.cloud/coop-mediation-numerique-ci/circleci-postgres:pg17-vector-postgis
        credentials:
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
        env:
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      maildev:
        image: maildev/maildev:2.2.1
        env:
          MAILDEV_INCOMING_USER: mailuser
          MAILDEV_INCOMING_PASS: mailpassword
        ports:
          - 1025:1025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test environment
        uses: ./.github/actions/test-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Run cucumber with coverage
        run: pnpm -F @app/web test:cucumber:coverage
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: apps/web/coverage-cucumber/lcov.info
          base-path: apps/web
          flag-name: cucumber
          parallel: true
          fail-on-error: false

  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create env file
        run: cp .env.dist .env
      - name: Add secrets to env file
        run: pnpm --silent cli dotenv:from-secrets
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      - name: Build storybook and deploy on chromatic
        run: pnpm --silent -F @app/storybook chromatic

  coverage:
    name: Coverage
    needs:
      - test-packages
      - test-web
      - integration-tests
      - cucumber
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel Coveralls build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: 'packages,web-unit,web-integration,cucumber'
          fail-on-error: false
