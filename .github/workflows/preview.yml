---
name: Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - 'dev'
      - 'main'

jobs:
  approval:
    name: Approve preview
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: preview-approval-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - name: Preview approved
        env:
          BRANCHE: ${{ github.head_ref }}
        run: echo "Déploiement de la preview de « $BRANCHE » approuvé"

  deploy:
    name: Deploy preview
    needs: approval
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      deployments: write
    secrets: inherit
