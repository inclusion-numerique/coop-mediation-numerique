---
name: Deploy

on:
  workflow_call:
    inputs:
      environnement:
        description: 'Branch whose environment to deploy'
        type: string
        required: true
      namespace:
        description: 'Namespace derived from the branch'
        type: string
        required: true
      environnement-github:
        description: 'GitHub environment name of the branch'
        type: string
        required: true
      image:
        description: 'Container image to deploy'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environnement }}
  cancel-in-progress: false

env:
  BRANCHE: ${{ inputs.environnement }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environnement-github }}
      url: ${{ steps.status.outputs.url }}
    env:
      NAMESPACE: ${{ inputs.namespace }}
      ENVIRONNEMENT: ${{ inputs.environnement-github }}
      WEB_CONTAINER_IMAGE: ${{ inputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Setup and export database password
        run: |
          pnpm --silent cli secrets:database:setup "$NAMESPACE"
          DATABASE_PASSWORD=$(pnpm --silent cli secrets:database-password "$NAMESPACE")
          echo "::add-mask::$DATABASE_PASSWORD"
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> "$GITHUB_ENV"
      - name: Create infrastructure variables file from environment variables
        run: pnpm --silent cli infrastructure:vars-from-env
      - name: Infrastructure
        uses: ./.github/actions/infrastructure
        with:
          namespace: ${{ inputs.environnement-github }}
      - name: Migrate coop schema on the Entrepôt (SSH tunnel)
        if: env.BRANCHE == 'main'
        run: |
          set -a
          source .env
          set +a
          KEY_FILE="$(mktemp)"
          printf '%s' "$ENTREPOT_BASTION_SSH_KEY" | base64 -d > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh -f -N \
            -o StrictHostKeyChecking=accept-new \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -i "$KEY_FILE" \
            -p "${ENTREPOT_BASTION_PORT:-22}" \
            -L 5433:172.16.20.14:5432 \
            "$ENTREPOT_BASTION_USER@$ENTREPOT_BASTION_HOST"
          for _ in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5433) 2>/dev/null && break; sleep 1; done
          DATABASE_URL="$ENTREPOT_DATABASE_URL" pnpm --silent -F @app/web db:baseline-main
          DATABASE_URL="$ENTREPOT_DATABASE_URL" pnpm --silent -F @app/web prisma migrate deploy
      - name: Apply infrastructure
        run: |
          pnpm --silent with-env tofu -chdir=infrastructure apply -input=false -auto-approve -var-file=.tfvars.json -var "branch=$BRANCHE" -var "namespace=$ENVIRONNEMENT"
          pnpm --silent with-env tofu -chdir=infrastructure output -json > infrastructure/outputs.json
      - name: Add infrastructure outputs to env file
        run: pnpm --silent cli dotenv:from-infrastructure
      - name: Mask env file values
        uses: ./.github/actions/mask-env
      - name: Migrate database
        if: env.BRANCHE != 'main'
        run: |
          set -a
          source .env
          set +a
          pnpm --silent -F @app/web db:migrate-deploy
      - name: Load fixtures
        if: env.BRANCHE != 'main'
        run: |
          set -a
          source .env
          set +a
          pnpm --silent -F @app/fixtures load
      - name: Check that deployed container status is ok
        id: status
        run: |
          set -a
          source .env
          set +a
          pnpm --silent cli deployment:check-status "https://$WEB_BASE_URL"
          echo "url=https://$WEB_BASE_URL" >> "$GITHUB_OUTPUT"
