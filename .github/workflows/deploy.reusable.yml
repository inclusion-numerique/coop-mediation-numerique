---
name: Deploy

on:
  workflow_call:
    inputs:
      environnement:
        description: 'Branch whose environment to deploy, instead of the pushed branch'
        type: string
        default: ''

concurrency:
  group: deploy-${{ inputs.environnement || github.ref_name }}
  cancel-in-progress: false

env:
  WEB_APP_DOCKER_REGISTRY: rg.fr-par.scw.cloud/coop-mediation-numerique-web-app
  BRANCHE: ${{ inputs.environnement || github.ref_name }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.namespace.outputs.namespace }}
      environnement: ${{ steps.namespace.outputs.environnement }}
      image: ${{ steps.namespace.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Compute deployment names
        id: namespace
        run: |
          NAMESPACE="${BRANCHE//\//-}"
          IMAGE_NAME="coop-mediation-numerique-web-$NAMESPACE"
          ENVIRONNEMENT=$(./apps/cli/node_modules/.bin/tsx -e "import { computeBranchNamespace } from './packages/cdk/src/utils.ts'; console.log(computeBranchNamespace(process.env.BRANCHE ?? ''))")
          {
            echo "namespace=$NAMESPACE"
            echo "environnement=$ENVIRONNEMENT"
            echo "image=$WEB_APP_DOCKER_REGISTRY/$IMAGE_NAME:${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Add NEXT_PUBLIC variables to env file
        run: pnpm --silent cli dotenv:add-next-public "${{ steps.namespace.outputs.namespace }}"
      - name: Build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-deploy-${{ steps.namespace.outputs.namespace }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-deploy-${{ steps.namespace.outputs.namespace }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build next app
        run: SENTRY_RELEASE=true pnpm --silent -F @app/web build
      - name: Build docker image
        run: DOCKER_BUILDKIT=1 docker build --progress=plain -t "${{ steps.namespace.outputs.image }}" -f docker/web/Dockerfile .
      - name: Push docker image
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          echo "$SCW_SECRET_KEY" | docker login "$WEB_APP_DOCKER_REGISTRY" --username nologin --password-stdin
          docker push "${{ steps.namespace.outputs.image }}"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ needs.build.outputs.environnement }}
      url: ${{ steps.status.outputs.url }}
    env:
      CDK_FORCE_BRANCH: ${{ inputs.environnement || github.ref_name }}
      NAMESPACE: ${{ needs.build.outputs.namespace }}
      WEB_CONTAINER_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: '22'
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Setup and export database password
        run: |
          pnpm --silent cli secrets:database:setup "$NAMESPACE"
          DATABASE_PASSWORD=$(pnpm --silent cli secrets:database-password "$NAMESPACE")
          echo "::add-mask::$DATABASE_PASSWORD"
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> "$GITHUB_ENV"
      - name: Create terraform variables file from environment variables
        run: pnpm --silent cli terraform:vars-from-env web
      - name: Migrate coop schema on the Entrepôt (SSH tunnel)
        if: env.BRANCHE == 'main'
        run: |
          set -a
          source .env
          set +a
          KEY_FILE="$(mktemp)"
          printf '%s' "$ENTREPOT_BASTION_SSH_KEY" | base64 -d > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh -f -N \
            -o StrictHostKeyChecking=accept-new \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -i "$KEY_FILE" \
            -p "${ENTREPOT_BASTION_PORT:-22}" \
            -L 5433:172.16.20.14:5432 \
            "$ENTREPOT_BASTION_USER@$ENTREPOT_BASTION_HOST"
          for _ in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5433) 2>/dev/null && break; sleep 1; done
          DATABASE_URL="$ENTREPOT_DATABASE_URL" pnpm --silent -F @app/web db:baseline-main
          DATABASE_URL="$ENTREPOT_DATABASE_URL" pnpm --silent -F @app/web prisma migrate deploy
      - name: Deploy web app stack
        run: pnpm --silent -F @app/cdk cdktf deploy web --var-file .tfvars.json --auto-approve --outputs-file=cdk.out.json --outputs-file-include-sensitive-outputs
      - name: Add web stack outputs to env file
        run: pnpm --silent cli dotenv:from-cdk web
      - name: Mask env file values
        uses: ./.github/actions/mask-env
      - name: Migrate database
        if: env.BRANCHE != 'main'
        run: |
          set -a
          source .env
          set +a
          pnpm --silent -F @app/web db:migrate-deploy
      - name: Load fixtures
        if: env.BRANCHE != 'main'
        run: |
          set -a
          source .env
          set +a
          pnpm --silent -F @app/fixtures load
      - name: Check that deployed container status is ok
        id: status
        run: |
          set -a
          source .env
          set +a
          pnpm --silent cli deployment:check-status "https://$WEB_BASE_URL"
          echo "url=https://$WEB_BASE_URL" >> "$GITHUB_OUTPUT"
