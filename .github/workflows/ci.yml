---
name: CI

on:
  push:
    branches:
      - "build/*"
      - "chore/*"
      - "ci/*"
      - "docs/*"
      - "feat/*"
      - "fix/*"
      - "perf/*"
      - "refactor/*"
      - "revert/*"
      - "style/*"
      - "test/*"
      - "main"

permissions:
  contents: read

env:
  ENV: ephemeral

jobs:
  regles-modifiees:
    name: Architecture rules changes
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect architecture rules changes
        id: changes
        run: |
          regles=(biome.json .alint.yml .dependency-cruiser.cjs .dependency-cruiser .claude/settings.json .claude/hooks)
          if git diff --quiet origin/main...HEAD -- "${regles[@]}"; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "Aucune règle d'architecture modifiée" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Règles d'architecture modifiées"
              echo
              echo '```diff'
              git diff origin/main...HEAD -- "${regles[@]}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  approve-regles:
    name: Approve architecture rules
    needs: regles-modifiees
    if: needs.regles-modifiees.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: regles-d-architecture
    steps:
      - name: Architecture rules approved
        run: echo "Changements de règles d'architecture approuvés"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create env file
        run: cp .env.example .env
      - name: Tsc
        run: pnpm tsc
      - name: Lint - biome
        run: pnpm exec biome check .
      - name: Lint - structure
        run: pnpm exec alint check --no-spawn --format github
      - name: Lint - imports
        run: pnpm --silent lint:imports --output-type err-long
      - name: Lint - ADR
        run: pnpm --silent lint:adr --output github
      - name: Lint - Code mort
        run: pnpm exec knip --reporter github-actions
      - name: Generate openapi docs for api v1
        run: pnpm --silent api-v1-doc:generate
      - name: Check that openapi spec file is up to date
        run: |
          git diff --exit-code src/features/clients-api/implementations/openapi/v1.openapi.json || {
            echo "::error::Openapi spec file has changed, please run 'pnpm --silent api-v1-doc:generate' to update the openapi spec file and commit the changes"
            exit 1
          }
      - name: Lint application - api
        run: pnpm lint:api

  commit-check:
    name: Lint commits
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-commit-check
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint commits
        run: pnpm lint:commit

  test-web:
    name: Test web
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-web
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create env file
        run: cp .env.example .env
      - name: Test application with coverage
        run: pnpm --silent exec vitest run --project unit --coverage
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          files: coverage/lcov.info
          flag-name: web-unit
          parallel: true
          fail-on-error: false
      - name: Publish test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: "junit/*.xml"
          check_name: "Unit tests summary"
          annotate_only: true

  jobs-runner:
    name: Jobs runner
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-jobs-runner
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create env file
        run: cp .env.example .env
      - name: Build jobs runner
        run: pnpm --silent build:jobs
      - name: Check jobs runner
        run: pnpm --silent with-env node dist/verifier-le-bundle.cjs

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-integration-tests
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/inclusion-numerique/coop-postgres-ci:pg17-vector-postgis
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      maildev:
        image: maildev/maildev:3.0.0
        env:
          MAILDEV_INCOMING_USER: mailuser
          MAILDEV_INCOMING_PASS: mailpassword
        ports:
          - 1025:1025
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test environment
        uses: ./.github/actions/test-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Run web integration tests with coverage
        run: |
          set -a
          source .env
          set +a
          pnpm --silent exec vitest run --project integration --coverage
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          files: coverage/lcov.info
          flag-name: web-integration
          parallel: true
          fail-on-error: false
      - name: Publish test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: "junit/*.xml"
          check_name: "Integration tests summary"
          annotate_only: true

  cucumber:
    name: Cucumber
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cucumber
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/inclusion-numerique/coop-postgres-ci:pg17-vector-postgis
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      maildev:
        image: maildev/maildev:3.0.0
        env:
          MAILDEV_INCOMING_USER: mailuser
          MAILDEV_INCOMING_PASS: mailpassword
        ports:
          - 1025:1025
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test environment
        uses: ./.github/actions/test-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Run cucumber with coverage
        run: pnpm test:cucumber:coverage --format progress --format junit:junit/cucumber.xml
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          files: coverage-cucumber/lcov.info
          flag-name: cucumber
          parallel: true
          fail-on-error: false
      - name: Publish test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: "junit/*.xml"
          check_name: "Cucumber summary"
          annotate_only: true

  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-chromatic
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Build storybook and deploy on chromatic
        run: pnpm --silent chromatic

  components:
    name: Components
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-components
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          cypress: "true"
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Run Cypress component tests
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          install: false
          command: pnpm cy run --component --reporter junit --reporter-options mochaFile=e2e/junit/components-[hash].xml
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: components-cypress
          path: |
            e2e/screenshots
          retention-days: 30
      - name: Publish test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: "e2e/junit/*.xml"
          check_name: "Components tests summary"
          annotate_only: true

  e2e:
    name: E2E ${{ matrix.conteneur }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-e2e-${{ matrix.conteneur }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        conteneur: [0, 1, 2]
    services:
      postgres:
        image: ghcr.io/inclusion-numerique/coop-postgres-ci:pg17-vector-postgis
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      maildev:
        image: maildev/maildev:3.0.0
        env:
          MAILDEV_INCOMING_USER: mailuser
          MAILDEV_INCOMING_PASS: mailpassword
        ports:
          - 1025:1025
          - 1080:1080
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          cypress: "true"
      - name: Test environment
        uses: ./.github/actions/test-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Add e2e variables to env file
        run: |
          cat >> .env <<'DOTENV'
          IS_E2E=true
          NEXT_PUBLIC_PROCONNECT_HOSTNAME=localhost:8443
          NEXT_PUBLIC_PROCONNECT_CLIENT_ID=coop-e2e
          PROCONNECT_CLIENT_SECRET=proconnect-simule
          DOTENV
      - name: Start simulated ProConnect
        run: |
          mkdir -p "$RUNNER_TEMP/proconnect-simule"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" \
            -keyout "$RUNNER_TEMP/proconnect-simule/cle.pem" \
            -out "$RUNNER_TEMP/proconnect-simule/certificat.pem"
          PROCONNECT_SIMULE_PORT=8443 \
          PROCONNECT_SIMULE_CERTIFICAT="$RUNNER_TEMP/proconnect-simule/certificat.pem" \
          PROCONNECT_SIMULE_CLE="$RUNNER_TEMP/proconnect-simule/cle.pem" \
            nohup node e2e/proconnect-simule/serveur.ts > "$GITHUB_WORKSPACE/proconnect-simule.log" 2>&1 &
      - name: Build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build next app
        run: |
          set -a
          source .env
          set +a
          pnpm --silent build
      - name: Start standalone server
        run: |
          mv .next/standalone ~/dist
          mv public ~/dist/public
          mv private-static ~/dist/private-static
          mv .next/static ~/dist/.next/static
          set -a
          source .env
          set +a
          cd ~/dist
          NODE_TLS_REJECT_UNAUTHORIZED=0 HOSTNAME=localhost nohup node server.js > "$GITHUB_WORKSPACE/server.log" 2>&1 &
      - name: Run Cypress e2e tests
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        env:
          SPLIT: 3
          SPLIT_INDEX: ${{ matrix.conteneur }}
          SPLIT_FILE: e2e/timings.json
        with:
          install: false
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          command: pnpm cy run --reporter junit --reporter-options mochaFile=e2e/junit/e2e-[hash].xml
      - name: Upload Cypress screenshots and server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-cypress-${{ matrix.conteneur }}
          path: |
            e2e/screenshots
            server.log
            proconnect-simule.log
          retention-days: 30
      - name: Publish test summary
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: "e2e/junit/*.xml"
          check_name: "E2E tests summary"
          annotate_only: true

  coverage:
    name: Coverage
    needs:
      - test-web
      - integration-tests
      - cucumber
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-coverage
      cancel-in-progress: true
    steps:
      - name: Close parallel Coveralls build
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true
          carryforward: "web-unit,web-integration,cucumber"
          fail-on-error: false

  dependency-review:
    name: Dependency review
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          base-ref: main
          head-ref: ${{ github.sha }}
          fail-on-severity: critical

  infrastructure-changes:
    name: Infrastructure changes
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect infrastructure changes
        id: changes
        run: |
          if git diff --quiet origin/main...HEAD -- infrastructure/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement dans infrastructure/ : rien à planifier"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  infrastructure-plan:
    name: Infrastructure plan ${{ matrix.environnement }}
    needs: infrastructure-changes
    if: needs.infrastructure-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        environnement:
          - dev
          - main
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-infrastructure-plan-${{ matrix.environnement }}
      cancel-in-progress: true
    uses: ./.github/workflows/infrastructure-plan.reusable.yml
    with:
      environnement: ${{ matrix.environnement }}
    secrets: inherit
