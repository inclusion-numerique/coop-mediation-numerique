name: "Setup Node & pnpm"
description: "Install pnpm, Node.js and dependencies"

inputs:
  cypress:
    description: "Also install the Cypress binary"
    default: "false"
  node-version:
    description: "Node.js version, instead of engines.node in package.json"
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && 'package.json' || '' }}
        cache: "pnpm"
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
      env:
        CYPRESS_INSTALL_BINARY: "0"
    - name: Cache Cypress binary
      if: inputs.cypress == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Cypress binary
      if: inputs.cypress == 'true'
      run: pnpm exec cypress install
      shell: bash
