name: coop

services:
  maildev:
    image: maildev/maildev:3.0.0
    environment:
      MAILDEV_INCOMING_USER: mailuser
      MAILDEV_INCOMING_PASS: mailpassword
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"

  db:
    build:
      context: ./docker/postgres
      pull: true
    image: coop-postgis-pgvector:pg17
    pull_policy: build
    container_name: coop_pg
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${NEXT_PUBLIC_APP_SLUG}
      POSTGRES_USER: ${NEXT_PUBLIC_APP_SLUG}
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - coop-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  coop-pgdata:
    name: coop_pgdata
